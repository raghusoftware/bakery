{% extends 'base.html' %}
{% block title %}Reports - Jay Narayan Bakery{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h5 class="mb-0 fw-bold">Reports</h5>
  </div>

  <!-- Date Range -->
  <div class="card mb-3">
    <div class="card-body">
      <h6 class="fw-bold small mb-2">Date Range</h6>
      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="form-label small">From</label>
          <input type="date" id="rep-from" class="form-control form-control-sm">
        </div>
        <div class="col-6">
          <label class="form-label small">To</label>
          <input type="date" id="rep-to" class="form-control form-control-sm">
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-outline-primary" onclick="quickRange('today')">Today</button>
        <button class="btn btn-sm btn-outline-primary" onclick="quickRange('week')">Week</button>
        <button class="btn btn-sm btn-outline-primary" onclick="quickRange('month')">Month</button>
        <button class="btn btn-sm btn-primary" onclick="generateReport()">Generate</button>
      </div>
    </div>
  </div>

  <!-- Summary Stats -->
  <div class="row g-2 mb-3" id="report-stats" style="display:none">
    <div class="col-6">
      <div class="stat-card">
        <div class="stat-value text-primary" id="rep-total-sales">0</div>
        <div class="stat-label">Total Sales</div>
      </div>
    </div>
    <div class="col-6">
      <div class="stat-card">
        <div class="stat-value text-success" id="rep-revenue">₹0</div>
        <div class="stat-label">Revenue</div>
      </div>
    </div>
    <div class="col-6">
      <div class="stat-card">
        <div class="stat-value" id="rep-avg">₹0</div>
        <div class="stat-label">Avg Sale</div>
      </div>
    </div>
    <div class="col-6">
      <div class="stat-card">
        <div class="stat-value text-info" id="rep-gst">₹0</div>
        <div class="stat-label">GST Collected</div>
      </div>
    </div>
  </div>

  <!-- Revenue Chart -->
  <div class="card mb-3" id="revenue-chart-card" style="display:none">
    <div class="card-body">
      <h6 class="fw-bold small mb-2">Daily Revenue</h6>
      <canvas id="revenueChart" height="130"></canvas>
    </div>
  </div>

  <!-- Payment Mode Chart -->
  <div class="card mb-3" id="payment-chart-card" style="display:none">
    <div class="card-body">
      <h6 class="fw-bold small mb-2">Payment Modes</h6>
      <canvas id="paymentChart" height="160"></canvas>
    </div>
  </div>

  <!-- Sales Table -->
  <div class="card mb-3" id="sales-table-card" style="display:none">
    <div class="card-body">
      <h6 class="fw-bold small mb-2">Sales Detail</h6>
      <div id="report-sales-table"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let revenueChart = null;
let paymentChart = null;

function quickRange(type) {
  const now = new Date();
  const toStr = now.toISOString().split('T')[0];
  let from;
  if (type === 'today') {
    from = toStr;
  } else if (type === 'week') {
    const d = new Date(now); d.setDate(d.getDate() - 6);
    from = d.toISOString().split('T')[0];
  } else if (type === 'month') {
    from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  }
  document.getElementById('rep-from').value = from;
  document.getElementById('rep-to').value = toStr;
  generateReport();
}

async function generateReport() {
  const from = document.getElementById('rep-from').value;
  const to = document.getElementById('rep-to').value;
  if (!from || !to) { alert('Please select date range'); return; }

  let url = '/api/sales/?from=' + from + '&to=' + to;
  const resp = await fetch(url);
  const data = await resp.json();
  const sales = data.sales;

  const totalRev = sales.reduce((s, x) => s + parseFloat(x.total), 0);
  const totalGst = sales.reduce((s, x) => s + parseFloat(x.gst_amount), 0);
  const avg = sales.length ? totalRev / sales.length : 0;

  document.getElementById('rep-total-sales').textContent = sales.length;
  document.getElementById('rep-revenue').textContent = '₹' + totalRev.toFixed(0);
  document.getElementById('rep-avg').textContent = '₹' + avg.toFixed(0);
  document.getElementById('rep-gst').textContent = '₹' + totalGst.toFixed(0);

  ['report-stats', 'revenue-chart-card', 'payment-chart-card', 'sales-table-card'].forEach(id => {
    document.getElementById(id).style.display = '';
  });

  // Daily revenue chart
  const dailyMap = {};
  sales.forEach(s => {
    const d = s.sale_date.split(' ')[0];
    dailyMap[d] = (dailyMap[d] || 0) + parseFloat(s.total);
  });
  const labels = Object.keys(dailyMap).sort();
  const values = labels.map(l => dailyMap[l]);

  if (revenueChart) revenueChart.destroy();
  revenueChart = new Chart(document.getElementById('revenueChart').getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [{ label: 'Revenue (₹)', data: values, borderColor: '#FF6B35', backgroundColor: 'rgba(255,107,53,0.1)', fill: true, tension: 0.4 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true }, x: { ticks: { maxRotation: 45 } } } }
  });

  // Payment mode pie
  const modeMap = {};
  sales.forEach(s => { modeMap[s.payment_mode] = (modeMap[s.payment_mode] || 0) + parseFloat(s.total); });
  if (paymentChart) paymentChart.destroy();
  paymentChart = new Chart(document.getElementById('paymentChart').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(modeMap),
      datasets: [{ data: Object.values(modeMap), backgroundColor: ['#FF6B35','#3498DB','#27AE60','#E74C3C'] }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });

  // Sales table
  document.getElementById('report-sales-table').innerHTML = `
    <div class="table-responsive">
      <table class="table table-sm">
        <thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="text-end">Amount</th></tr></thead>
        <tbody>
          ${sales.map(s => `
            <tr>
              <td class="small text-primary fw-medium">${s.invoice_no}</td>
              <td class="small">${s.sale_date}</td>
              <td class="small">${s.customer}</td>
              <td class="text-end small fw-bold">₹${parseFloat(s.total).toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

quickRange('week');
</script>
{% endblock %}
