<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JN Bakery">
  <meta name="description" content="Jay Narayan Bakery Point of Sale System">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <title>{% block title %}Jay Narayan Bakery POS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/pos.css" rel="stylesheet">
</head>
<body>
  {% block body %}
  <div id="app">
    {% block content %}{% endblock %}
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item {% if request.path == '/' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>
    <a href="/pos/" class="bottom-nav-item {% if request.path == '/pos/' %}active{% endif %}">
      <i class="bi bi-cart3"></i>
      <span>POS</span>
    </a>
    <a href="/products/" class="bottom-nav-item {% if request.path == '/products/' %}active{% endif %}">
      <i class="bi bi-box-seam"></i>
      <span>Products</span>
    </a>
    <a href="/sales/" class="bottom-nav-item {% if request.path == '/sales/' %}active{% endif %}">
      <i class="bi bi-receipt"></i>
      <span>Sales</span>
    </a>
    <a href="/settings/" class="bottom-nav-item {% if request.path == '/settings/' %}active{% endif %}">
      <i class="bi bi-gear"></i>
      <span>Settings</span>
    </a>
  </nav>
  {% endblock %}

  <!-- Toast Container -->
  <div id="toast-container" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/db.js"></script>
  <script src="/static/js/printer.js"></script>
  {% block extra_js %}{% endblock %}

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/js/sw.js', { scope: '/' }).catch(() => {});
    }

    // Global toast helper
    window.showToast = (msg, type = 'info') => {
      const colors = { success: '#27AE60', error: '#E74C3C', info: '#3498DB' };
      const el = document.createElement('div');
      el.textContent = msg;
      Object.assign(el.style, {
        padding: '10px 20px', borderRadius: '24px', fontSize: '14px', fontWeight: '600',
        color: '#fff', background: colors[type] || colors.info,
        boxShadow: '0 4px 16px rgba(0,0,0,.2)', whiteSpace: 'nowrap',
        animation: 'toastIn .25s ease',
      });
      const style = document.createElement('style');
      style.textContent = '@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}';
      document.head.appendChild(style);
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    };

    // Online/offline
    window.addEventListener('online',  () => { showToast('Back online — syncing…', 'success'); BakeryDB?.syncPendingSales(); });
    window.addEventListener('offline', () => showToast('Offline — sales saved locally', 'info'));
  </script>
</body>
</html>
